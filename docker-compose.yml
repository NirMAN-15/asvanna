services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: asvanna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-asvanna_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Express.js REST API & Intelligence Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asvanna-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-asvanna_db}
      JWT_SECRET: ${JWT_SECRET:-asvanna_jwt_secret_key_2026}
      JWT_EXPIRES_IN_FARMER: 24h
      JWT_EXPIRES_IN_OFFICER: 8h
      RISK_SAFE_THRESHOLD: 70
      RISK_WARNING_THRESHOLD: 85
    command: sh -c "node src/database/migrate.js && node src/database/seed.js && node src/server.js"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 3. React.js Multi-User Web Dashboard (Nginx)
  web-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asvanna-web-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
    driver: local
