services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: asvanna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-asvanna_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Express.js REST API & Intelligence Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asvanna-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-asvanna_db}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-asvanna_super_secure_jwt_moratuwa_2026_key}
      JWT_EXPIRES_IN_FARMER: 24h
      JWT_EXPIRES_IN_OFFICER: 8h
      JWT_EXPIRES_IN_BUYER: 24h
      JWT_EXPIRES_IN_ADMIN: 8h
      ADMIN_CREATION_KEY: ${ADMIN_CREATION_KEY:-asvanna#2026}
      RISK_SAFE_THRESHOLD: 40.0
      RISK_WARNING_THRESHOLD: 65.0
      ENABLE_SCHEDULED_JOBS: "true"
    command: sh -c "node src/database/migrate.js && node src/database/seed_admin.js && node src/database/seed.js && node src/database/seed_bandarawela_cultivation.js && node src/server.js"
    ports:
      # Exposed to host for debugging; nginx reaches backend via Docker internal network
      - "127.0.0.1:5000:5000"
    volumes:
      - backend_data:/app/data

  # 3. React.js Multi-User Web Dashboard (Nginx)
  # Nginx serves the React SPA and reverse-proxies /api/* to the backend container
  web-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asvanna-web-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local
